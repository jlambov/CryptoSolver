[project]
name = "cryptosolver"
version = "0.1.0"
description = "Interactive cryptographic analysis and Kryptos research application"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10.3",
    "numpy>=2.3.1",
    "pandas>=2.3.0",
    "plotly>=6.1.2",
    "psycopg2-binary>=2.9.10",
    "sqlalchemy>=2.0.41",
    "streamlit>=1.46.0",
]

[tool.setuptools]
py-modules = [
    "analysis",
    "app",
    "ciphers",
    "database",
    "key_testing",
    "kryptos",
    "kryptos_visual",
    "rate_limiter",
    "utils",
]

